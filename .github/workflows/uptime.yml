name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Cache keys are immutable, so each run saves under a new key and the
      # next run restores the newest one by prefix.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - run: ./check.sh
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
